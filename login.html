<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/mobile.css">
    <title>Sellora - Giriş</title>
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <h1>Sellora</h1>
            <p>Anbar idarəetmə sisteminə xoş gəlmisiniz</p>
            
            <form id="loginForm">
                <input type="text" id="magazaAdiInput" placeholder="Mağaza adını daxil edin..." required autocomplete="off">
                <button type="submit">Daxil ol</button>
                <!-- Düymənin aşağısında mesajın görünməsi üçün -->
                <p id="loginMesaj" style="margin-top: 10px; font-size: 14px; text-align: center;"></p>
            </form>
        </div>
    </div>


  
</body>
<script src="/login.js"></script>

</body>

</html>
